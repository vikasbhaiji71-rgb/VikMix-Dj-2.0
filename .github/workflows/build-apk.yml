name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-apk:
    name: Build VikMix DJ APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js 22 required by Capacitor CLI
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Java 17 required for Android build
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Build React/Vite application
      - name: Build web application
        run: npm run build

      # 6. Capacitor Android sync
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 7. Remove invalid Android resource files
      - name: Clean invalid Android resources
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          if [ -d "$RES" ]; then
            echo "Checking Android resources..."

            find "$RES" -type f \
              ! -name '*.xml' \
              ! -name '*.png' \
              ! -name '*.webp' \
              ! -name '*.jpg' \
              ! -name '*.jpeg' \
              ! -name '*.gif' \
              ! -name '*.9.png' \
              -print -delete

            echo "Invalid resource cleanup completed."
          else
            echo "Android res directory not found."
          fi

      # 8. Make Gradle executable
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 9. Build Debug APK
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # 10. Find generated APK
      - name: Verify APK
        shell: bash
        run: |
          echo "Searching for APK..."
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      # 11. Upload APK
      - name: Upload VikMix DJ APK
        uses: actions/upload-artifact@v4
        with:
          name: vikmix-dj-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
