<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2433"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <linearGradient id="vinylGroove" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="50%" stop-color="#2a2d36"/>
      <stop offset="100%" stop-color="#121318"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#2d3748" stroke-width="6"/>

  <!-- Mixer body plate -->
  <rect x="36" y="56" width="440" height="400" rx="30" fill="#12151d" stroke="#1f2533" stroke-width="4"/>

  <!-- Turntable Deck A (Cyan) -->
  <g transform="translate(140, 200)">
    <circle r="92" fill="#0d0e12" stroke="url(#neonCyan)" stroke-width="4"/>
    <circle r="76" fill="url(#vinylGroove)" stroke="#222733" stroke-width="2"/>
    <circle r="56" fill="#151821" stroke="#2a3245" stroke-width="1.5"/>
    <circle r="36" fill="#0d0f14"/>
    <circle r="22" fill="url(#neonCyan)"/>
    <circle r="7" fill="#ffffff"/>
    <!-- Tonearm -->
    <path d="M 80 -80 L 30 -20 L 15 -10" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="80" cy="-80" r="10" fill="#334155"/>
  </g>

  <!-- Turntable Deck B (Orange) -->
  <g transform="translate(372, 200)">
    <circle r="92" fill="#0d0e12" stroke="url(#neonOrange)" stroke-width="4"/>
    <circle r="76" fill="url(#vinylGroove)" stroke="#222733" stroke-width="2"/>
    <circle r="56" fill="#151821" stroke="#2a3245" stroke-width="1.5"/>
    <circle r="36" fill="#0d0f14"/>
    <circle r="22" fill="url(#neonOrange)"/>
    <circle r="7" fill="#ffffff"/>
    <!-- Tonearm -->
    <path d="M -80 -80 L -30 -20 L -15 -10" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-80" cy="-80" r="10" fill="#334155"/>
  </g>

  <!-- Central Mixer Section -->
  <rect x="236" y="90" width="40" height="220" rx="8" fill="#1a1e29" stroke="#2d3748" stroke-width="2"/>
  <!-- VU meters -->
  <line x1="248" y1="110" x2="248" y2="280" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4"/>
  <line x1="264" y1="110" x2="264" y2="280" stroke="#ff3366" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4"/>

  <!-- Crossfader channel at bottom -->
  <rect x="80" y="360" width="352" height="34" rx="17" fill="#0b0d13" stroke="#252b3b" stroke-width="3"/>
  <line x1="120" y1="377" x2="392" y2="377" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Crossfader knob centered -->
  <rect x="236" y="348" width="40" height="58" rx="8" fill="#e2e8f0" stroke="#00f0ff" stroke-width="3"/>
  <line x1="256" y1="356" x2="256" y2="398" stroke="#0f172a" stroke-width="4"/>

  <!-- Brand Typography -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="4" fill="#f8fafc">VIKMIX DJ</text>
</svg>
